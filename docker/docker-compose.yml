version: "3.9"

services:
  db:
    image: mysql:8.0
    container_name: totalcode_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: totalcode
      MYSQL_USER: total
      MYSQL_PASSWORD: total
    ports:
      - "3307:3306"        # opcional: si quieres acceder desde Workbench
    volumes:
      - db_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -proot | grep 'mysqld is alive' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
      dockerfile: ../docker/backend/Dockerfile
    container_name: totalcode_backend
    restart: always
    env_file:
      - ../backend/.env
    volumes:
      - ../backend:/var/www/html
    ports:
      - "8080:80"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: nginx:alpine
    container_name: totalcode_frontend
    restart: always
    ports:
      - "8081:80"
    volumes:
      - ../frontend/public:/usr/share/nginx/html:ro
    depends_on:
      - backend

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: totalcode_phpmyadmin
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      PMA_USER: root
      PMA_PASSWORD: root
    depends_on:
      - db
    ports:
      - "8082:80"
volumes:
  db_data:
